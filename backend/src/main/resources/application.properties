spring.application.name=bankapp
spring.profiles.active=dev

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:bankappdb}
spring.datasource.username=${DATABASE_USER:bankuser}
spring.datasource.password=${DATABASE_PASSWORD:bankpass123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Virtual threads
spring.threads.virtual.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-key-that-should-be-at-least-256-bits-long-for-security}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Ollama AI Configuration
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=llama3.2:1b
ollama.timeout=30000

# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,https://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600

# Logging
logging.level.root=INFO
logging.level.com.bankapp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
