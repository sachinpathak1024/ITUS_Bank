apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: itus-ns
  labels:
    app: backend-label
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-label
  template:
    metadata:
      labels:
        app: backend-label
    spec:
      initContainers:
      - name: wait-for-psql
        image: busybox:1.36
        command: ["/bin/sh", "-c", "until nc -z psql-svc 5432; do sleep 2; done"]
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"

      - name: wait-for-ollama
        image: busybox:1.36
        command: ["/bin/sh", "-c", "until nc -z ollama-svc 11434; do sleep 2; done"]
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"


      containers:
      - name: backend
        image: sach990p/itus-backend:1c7cb0e
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
          - configMapRef:
              name: itus-configmap
          - secretRef:
              name: itus-secrets

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "2000m"
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 75
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3