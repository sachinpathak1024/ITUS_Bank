apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bankapp-tls
  namespace: itus-ns
spec:
  secretName: bankapp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - itus.sachinpathak.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: itus-gateway
  namespace: itus-ns
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy-gateway
  listeners:
    # HTTP — needed for cert-manager ACME HTTP-01 challenge validation
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # HTTPS — TLS terminated at Envoy Gateway
    - name: https
      protocol: HTTPS
      port: 443
      hostname: itus.sachinpathak.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: bankapp-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: itus-route
  namespace: itus-ns
spec:
  hostnames:
    - itus.sachinpathak.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: itus-gateway
      sectionName: https
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: itus-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /actuator
      backendRefs:
        - name: backend-svc
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend-svc
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-svc
          port: 80
---
# Session persistence: Cookie-based affinity for browser sessions
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: itus-session
  namespace: itus-ns
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: itus-route
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Cookie
      cookie:
        name: ITUS_AFFINITY
        ttl: 3600s
